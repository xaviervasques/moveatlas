name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[bench]" || python -m pip install -e .
          python -m pip install scikit-learn scipy pytest
      - name: Test
        run: python -m pytest -q
      - name: Smoke release_lint
        run: python release_lint.py --help || true
