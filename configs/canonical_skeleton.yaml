# ---------------------------------------------------------------------------
# Dimensionality: no 2D->3D lifting (Handoff 3, decision 7.3/7.5).
# ---------------------------------------------------------------------------
dimensionality:
  policy: no_lifting
  rationale: >
    Lifting 2D to 3D fabricates data and introduces an unmeasurable depth bias.
    Keep native dimensionality; the model handles the missing axis via masking.
  per_sample_flag: dim                 # 2 or 3
  storage_shape: [T, J, 3]             # J = 15; z-channel masked when dim == 2
  masks:
    coordinate_mask: true              # marks the absent z-axis for 2D samples
    joint_presence_mask: true          # marks derived/proxy/absent joints per source
  modality_embedding: true             # a learned token per source-space {2d_pixel, 3d_meter}

# ---------------------------------------------------------------------------
# Temporal sampling: no global decimation (Handoff 3, decision 7.6).
# ---------------------------------------------------------------------------
sampling:
  policy: no_global_decimation
  fps: per_sample_attribute            # store native fps with each sample
  fps_provenance: optional_record_attribute   # a sentence saying where fps comes from (declared by the source, measured from a time column, or a nominal rate stated in its documentation); physionet_multimodal_gait since 2026-09-08, remap_open and li_taati since 2026-09-29
  rationale: >
    A myoclonic jerk lasts 20-100 ms; resampling to 25-30 fps erases it. Preserve
    high-frequency subsets. Any resampling is opt-in and recorded per sample.
  known_fps:
    cody: 33.3                         # dt = 0.03 s, measured
    li_taati: 30.0                     # video rate stated by the data paper (doi:10.1186/s12984-018-0446-z), nominal; fps_provenance on each record (2026-09-29)
    care_pd: unknown                   # mocap-derived; confirm per cohort
    remap_open: 30.0                   # stated by the deposit readme, nominal

# ---------------------------------------------------------------------------
# Normalization / harmonization pipeline (applied after mapping).
# ---------------------------------------------------------------------------
normalization:
  order: [root_center, y_axis_harmonize, scale, orient]
  root_center:
    op: subtract_root_per_frame
    joint: pelvis
  y_axis_harmonize:
    op: flip_image_y_to_up
    applies_to: [li_taati, cody_coco17]  # image y is down; flip so +y is up like SMPL
  scale:
    op: divide_by_reference_length
    segment: [pelvis, neck]            # torso length; per sample
    note: makes 2D pixel and 3D metric samples scale-comparable
  orient:
    op: procrustes_align
    applies_to: [smpl_carepd]          # 3D only; CARE-PD already canonical, reuse
    optional: true

# ---------------------------------------------------------------------------
# Tokenization plan for the encoder.
# ---------------------------------------------------------------------------
tokenization:
  scheme: spatiotemporal_patches
  patch_axes: [joints, time]
  channels_per_token: [x, y, z, coordinate_mask, joint_presence_mask]
  side_tokens: [modality_embedding, dim_flag, fps]
  masked_pretraining: true             # masked-patch reconstruction; masks respect presence

# ---------------------------------------------------------------------------
# Labels: never enter pretraining. For fine-tuning / evaluation probes only.
# ---------------------------------------------------------------------------
labels:
  cody_phenomenology: [Dystonia, Tremor, Myoclonus, Chorea, Tics, Athetosis,
                       Ballismus, Stereotypie]
  use: [fine_tuning, phenotype_probe]  # see eval protocol (Handoff 3 section 2.3)
  never: pretraining
